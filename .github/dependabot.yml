version: 2

updates:
  # Example ecosystem block — replace "npm" with this project's actual
  # package manager (npm, pip, bundler, gomod, ...), or delete this block
  # entirely if dependency updates aren't wanted yet.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'developer-experience'
    commit-message:
      prefix: '[noissue] - '
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Keeps the workflow files themselves patched. Harmless to leave in even on
  # a repo with no workflows installed yet — it just won't find anything to
  # update.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'developer-experience'
    commit-message:
      prefix: '[noissue] - '
    groups:
      actions-all:
        patterns: ['*']
