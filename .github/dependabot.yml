version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'developer-experience'
    commit-message:
      prefix: '[noissue] - '
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; see #8.
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Keeps the workflow files themselves patched. Harmless to leave in even on
  # a repo with no workflows installed yet — it just won't find anything to
  # update.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'developer-experience'
    commit-message:
      prefix: '[noissue] - '
    groups:
      actions-all:
        patterns: ['*']
