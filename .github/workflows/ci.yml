name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The generated client must match the server's published OpenAPI document.
      - name: API client drift
        env:
          PYN_OPENAPI: https://raw.githubusercontent.com/avalon-initiative/pyn/main/docs/generated/openapi.json
        run: npm run api:check

      # prettier, eslint, vue-tsc, vitest.
      - name: Checks
        run: make check

      - name: Build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook
