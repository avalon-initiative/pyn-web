name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # The generated client must match the server's published OpenAPI document.
      - name: API client drift
        env:
          PYN_OPENAPI: https://raw.githubusercontent.com/avalon-initiative/pyn/main/docs/generated/openapi.json
        run: npm run api:check

      - name: Public boundary
        run: make boundary-check

      # prettier, eslint, vue-tsc, vitest and the public-boundary check.
      - name: Checks
        run: make check

      - name: Build
        run: npm run build

  # Manual only: builds the Caddy image from a fresh dist/ and smoke-tests it read-only against a stub API.
  docker-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Build image
        run: docker build --tag pyn-web:ci .

      # Read-only, no capabilities, privileged ports through the sysctl, against a stub API: tests/docker/smoke.sh.
      - name: Smoke test
        run: bash tests/docker/smoke.sh pyn-web:ci

      # The release builds both platforms in one go; the builder stage cross-compiles, so nothing runs under emulation.
      - uses: docker/setup-buildx-action@v4

      - name: Cross-build the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
