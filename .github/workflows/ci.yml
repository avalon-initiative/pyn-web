name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      # The generated client must match the server's published OpenAPI document.
      - name: API client drift
        env:
          PYN_OPENAPI: https://raw.githubusercontent.com/avalon-initiative/pyn/main/docs/generated/openapi.json
        run: npm run api:check

      - name: Public boundary
        run: make boundary-check

      # prettier, eslint, vue-tsc, vitest and the public-boundary check.
      - name: Checks
        run: make check

      - name: Build
        run: npm run build
